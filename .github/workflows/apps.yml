name: Build apps

on:
  push:
    branches: [main]
    paths: ["apple/**", ".github/workflows/apps.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate project
        working-directory: apple
        run: xcodegen generate

      - name: Build Mac app (universal)
        working-directory: apple
        run: |
          xcodebuild -project RemoteDesktop.xcodeproj -scheme RemoteDesktop -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            RD_SERVER_URL="${{ vars.RD_SERVER_URL }}" build
          mkdir -p ../out
          ditto -c -k --keepParent "build/Build/Products/Release/Remote Desktop.app" ../out/RemoteDesktop-mac.zip

      - name: Build iOS app (compile check, unsigned)
        working-directory: apple
        run: |
          xcodebuild -project RemoteDesktop.xcodeproj -scheme RemoteViewer -configuration Release \
            -derivedDataPath build -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO RD_SERVER_URL="${{ vars.RD_SERVER_URL }}" build

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Remote Desktop v${{ github.run_number }}
          make_latest: true
          files: out/RemoteDesktop-mac.zip
