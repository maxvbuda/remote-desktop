name: Build helper app

on:
  push:
    branches: [main]
    paths: ["helper/**", ".github/workflows/helper.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: RemoteDesktopHelper-windows.exe
          - os: macos-latest
            asset: RemoteDesktopHelper-mac-apple-silicon.zip
          - os: macos-15-intel
            asset: RemoteDesktopHelper-mac-intel.zip
          - os: ubuntu-latest
            asset: RemoteDesktopHelper-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r helper/requirements.txt pyinstaller
      - name: Build
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="--hidden-import ApplicationServices --osx-bundle-identifier dev.remote-desktop.helper"; fi
          if [ "$RUNNER_OS" = "Linux" ]; then EXTRA="--collect-submodules Xlib"; fi
          pyinstaller --noconfirm --windowed --name RemoteDesktopHelper \
            --collect-submodules pynput $EXTRA \
            $( [ "$RUNNER_OS" = "macOS" ] || echo --onefile ) \
            helper/remote_helper.py
          mkdir out
          case "$RUNNER_OS" in
            Windows) cp dist/RemoteDesktopHelper.exe "out/${{ matrix.asset }}" ;;
            macOS)   ditto -c -k --keepParent dist/RemoteDesktopHelper.app "out/${{ matrix.asset }}" ;;
            Linux)   cp dist/RemoteDesktopHelper "out/${{ matrix.asset }}" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: helper-v${{ github.run_number }}
          name: Helper app v${{ github.run_number }}
          make_latest: true
          files: out/*
