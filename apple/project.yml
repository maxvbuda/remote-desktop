name: RemoteDesktop
options:
  bundleIdPrefix: dev.remotedesktop
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: 157.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Address of your Cloudflare Worker, baked into the apps as the default server.
    # CI sets it from the RD_SERVER_URL repository variable.
    RD_SERVER_URL: ""

targets:
  RemoteDesktop:
    type: application
    platform: macOS
    sources: [Shared, macOS]
    dependencies:
      - package: WebRTC
    scheme: {}
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Remote Desktop
        LSApplicationCategoryType: public.app-category.utilities
        RDServerURL: $(RD_SERVER_URL)
    settings:
      base:
        PRODUCT_NAME: Remote Desktop
        PRODUCT_MODULE_NAME: RemoteDesktop
        PRODUCT_BUNDLE_IDENTIFIER: dev.remotedesktop.mac
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  RemoteViewer:
    type: application
    platform: iOS
    sources: [Shared, iOS]
    dependencies:
      - package: WebRTC
    scheme: {}
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Remote Desktop
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        RDServerURL: $(RD_SERVER_URL)
    settings:
      base:
        PRODUCT_NAME: Remote Desktop
        PRODUCT_MODULE_NAME: RemoteViewer
        PRODUCT_BUNDLE_IDENTIFIER: dev.remotedesktop.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
